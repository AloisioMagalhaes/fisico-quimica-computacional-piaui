name: simulacao-segura
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'paper/**'
      - '.github/workflows/simulacao-segura.yml'
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/modelo.py
      - run: python -c "import csv;from pathlib import Path;p=Path('data/generated/decaimento.csv');assert p.exists() and sum(1 for _ in p.open())>2"
