name: simulacao-segura
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'paper/**'
      - '.github/workflows/simulacao-segura.yml'
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/modelo.py
      - run: python scripts/ciclo_c14.py
      - run: python -c "from pathlib import Path;assert all(Path(x).exists() for x in ['data/generated/decaimento.csv','data/generated/ciclo_c14.csv'])"
      - run: python tests/test_ciclo_c14.py
