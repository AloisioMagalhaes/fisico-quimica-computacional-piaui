name: quantum
on:
  workflow_dispatch:
  push:
    paths: [scripts/quantum_scan.py, scripts/summary_quantum.py, scripts/plot_quantum.py, tests/test_quantum_scan.py, .github/workflows/quantum.yml, requirements.txt]
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {method: hf, system: h2o}
          - {method: pbe, system: h2o}
          - {method: b3lyp, system: h2o}
          - {method: hf, system: c2}
          - {method: pbe, system: c2}
          - {method: b3lyp, system: c2}
          - {method: hf, system: c4}
          - {method: b3lyp, system: c4}
          - {method: hf, system: ring6}
          - {method: pbe, system: ring6}
          - {method: b3lyp, system: ring6}
          - {method: hf, system: tetra4}
          - {method: b3lyp, system: tetra4}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/quantum_scan.py
        env:
          METHOD: ${{ matrix.method }}
          SYSTEM: ${{ matrix.system }}
      - uses: actions/upload-artifact@v6
        with:
          name: quantum-${{ matrix.system }}-${{ matrix.method }}
          path: data/generated/quantum_${{ matrix.system }}_${{ matrix.method }}.json
  summary:
    needs: scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: quantum-*
          path: data
          merge-multiple: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/summary_quantum.py
      - run: python scripts/plot_quantum.py
      - uses: actions/upload-artifact@v6
        with:
          name: quantum-summary
          path: |
            quantum-summary.csv
            quantum-gap.png
