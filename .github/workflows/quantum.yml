name: quantum
on:
  workflow_dispatch:
  push:
    paths: [scripts/quantum_scan.py, scripts/summary_quantum.py, scripts/plot_quantum.py, tests/test_quantum_scan.py, .github/workflows/quantum.yml, requirements.txt]
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        method: [hf, pbe, b3lyp]
        system: [h2o, c2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/quantum_scan.py
        env:
          METHOD: ${{ matrix.method }}
          SYSTEM: ${{ matrix.system }}
      - uses: actions/upload-artifact@v6
        with:
          name: quantum-${{ matrix.system }}-${{ matrix.method }}
          path: data/generated/quantum_${{ matrix.system }}_${{ matrix.method }}.json
  summary:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: quantum-*
          path: data
          merge-multiple: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/summary_quantum.py
      - run: python scripts/plot_quantum.py
      - uses: actions/upload-artifact@v6
        with:
          name: quantum-summary
          path: |
            quantum-summary.csv
            quantum-gap.png
