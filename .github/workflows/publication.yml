name: publication
on:
  workflow_dispatch:
  push:
    paths: [paper/**, poster/**, paper/refs.bib, .github/workflows/publication.yml]
permissions:
  contents: read
jobs:
  latex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/main.tex
            poster/poster.tex
          latexmk_shell_escape: true
      - uses: actions/upload-artifact@v6
        with:
          name: publication-${{ github.sha }}
          path: |
            paper/main.pdf
            poster/poster.pdf
